<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Album Ranking</title>
  <link rel="icon" href="favicon.ico" />
  <meta name="theme-color" content="#0f1115" />
  <style>
    :root{--bg:#0f1115;--panel:#151922;--ink:#e9edf1;--muted:#aeb5c0;--line:#283143}
    html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    header{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#0f1115;border-bottom:1px solid #1b2030}
    header .sp{flex:1}
    .btn, label.btn{background:#1a2030;border:1px solid #2a3248;color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .tag{padding:6px 8px;border:1px solid #2a3248;border-radius:8px;font-size:12px}
    main{max-width:1100px;margin:0 auto;padding:14px}
    /* Panel de Library */
    #libPanel{display:none;margin-top:12px}
    table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid #222a3a;border-radius:12px;overflow:hidden}
    th,td{padding:10px 12px;border-bottom:1px solid #222a3a}
    thead th{background:#111724;color:#cbd5e1;text-align:left}
    .col-average,.col-tracks,.col-open{width:110px;text-align:center;white-space:nowrap}
    .col-cover{width:64px}
    .cover-sm{width:44px;height:44px;object-fit:cover;border-radius:6px;display:block;border:1px solid #2a3248}
    /* Contenedor del editor existente */
    #app{margin-top:12px}
  </style>
</head>
<body>
  <header>
    <strong>🎧 Album Ranking <span class="tag">v7.1</span></strong>
    <button id="btnLibrary" class="btn">📚 Library</button>
    <button id="btnSaveToLibrary" class="btn">💾 Save to Library</button>
    <button id="btnExportLibrary" class="btn">⬇️ Export Library</button>
    <input id="fileImportLibrary" type="file" accept="application/json" hidden />
    <label for="fileImportLibrary" class="btn">⬆️ Import Library</label>
    <div class="sp"></div>
    <select id="lang" class="btn">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
    <span id="authStatus" style="display:none;margin-left:6px"></span>
    <button id="btnSignIn" class="btn">Sign in with Google</button>
    <button id="btnSignOut" class="btn" style="display:none">Sign out</button>
  </header>

  <!-- Panel Library -->
  <main id="libPanel">
    <table>
      <thead>
      <tr>
        <th class="col-cover">Cover</th>
        <th>Album</th>
        <th>Artist</th>
        <th>Released</th>
        <th class="col-average">Average</th>
        <th class="col-tracks">Tracks</th>
        <th class="col-open">Open</th>
      </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="7" style="padding:14px;color:#aeb5c0">Loading…</td></tr></tbody>
    </table>
  </main>

  <!-- Aquí va TU editor existente (inputs, botones Sort Top 10, etc) -->
  <main id="app">
    <!-- Mantén tu HTML actual (el que ya te funciona para puntuar) -->
    <!-- No lo duplico aquí para no alargar la respuesta -->
  </main>

  <!-- Un SOLO script que maneja Auth + Library (evita choques) -->

  <!-- Tus scripts del editor (los que ya tenías y funcionan) -->

  <script defer src="ui.v7.1.js?v=7.1"></script>
</body>
</html>
