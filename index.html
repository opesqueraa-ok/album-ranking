<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f1115" />
<title>Album Rater</title>
<style>
:root{
  --c10:#2e47ee;--c9:#0285c6;--c8:#02aec6;--c7:#23be32;--c6:#f0ca15;--c5:#e12928;
  --bg:#0f1115;--panel:#161a22;--ink:#e9edf1;--muted:#aeb5c0;--line:#2a3140;--neutral:#2a3140
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;margin:0}
.wrap{max-width:1100px;margin:18px auto;padding:0 16px 64px}
h1{font-size:20px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.select,input,select,button{background:#0e1218;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px}
button{cursor:pointer;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.pair{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.label{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:grid;grid-template-columns:60px 90px 1fr 160px 90px 36px;gap:8px;align-items:center;margin-bottom:6px}
.noteBtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:#0e1218;color:var(--ink);cursor:pointer}
.noteBtn.active{outline:2px solid #3b82f6}
.pill{display:inline-flex;justify-content:center;align-items:center;padding:6px 10px;border-radius:8px;color:white;font-weight:800;min-width:52px;text-align:center}
.cover{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid var(--line);border-radius:10px;background:#0d1117}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;font-size:14px}
th{color:var(--muted);font-weight:600}
.final{font-size:52px;font-weight:800;text-align:center;margin-top:10px}
canvas{width:100%;height:320px;border:1px solid var(--line);border-radius:12px;background:#0e1218}
.footer{margin-top:10px;font-size:12px;color:#93a0b6}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#c9d3e3}
.badge-dot{width:8px;height:8px;border-radius:999px;background:var(--neutral);display:inline-block}
.small{font-size:12px;color:#9fb0c9}

/* Library modal */
#libModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:9999}
#libCard{width:min(900px,92vw);max-height:80vh;overflow:auto;background:#10141c;color:#e9edf1;border:1px solid var(--line);border-radius:12px;padding:14px}
.libToolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.libGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:720px){.libGrid{grid-template-columns:1fr}}
.libItem{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;background:#0d1218;border:1px solid var(--line);border-radius:10px;padding:8px}
.libCover{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#0d1117}
.libTitle{font-weight:700}
.libMeta{font-size:12px;color:#aeb5c0}
.libScore{font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <h1 style="margin-right:auto">Album Rater</h1>

    <!-- Auth -->
    <button id="btnLogin">Sign in with GitHub</button>
    <button id="btnLogout" style="display:none">Sign out</button>

    <!-- Library -->
    <button id="btnSaveLib" title="Save this album in your library">Save to Library</button>
    <button id="btnShowLib">My Library</button>

    <!-- Lang & data -->
    <select id="lang" class="select"><option value="en">English</option><option value="es">Español</option></select>
    <button id="exportJSON">Export Data</button>
    <label style="position:relative">
      <span id="importLabel" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;display:inline-block">Import Data</span>
      <input id="importJSON" type="file" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer">
    </label>
    <button id="clearAll">Clear All Data</button>
    <button id="sortTop10">Sort Top 10</button>
  </div>
  <div class="sub" id="subtitle"></div>

  <div class="grid">
    <div class="card pad">
      <div class="pair">
        <div class="label" data-i18n="album">Album</div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="album" placeholder="Album name">
          <button id="btnBuscarAlbum" type="button">Buscar info</button>
        </div>
      </div>
      <div class="pair"><div class="label" data-i18n="artist">Artist</div><input id="artist" placeholder="Artist"></div>
      <div class="pair"><div class="label" data-i18n="released">Release Date</div><input id="released" placeholder="Aug 1, 2025"></div>
      <div class="pair"><div class="label" data-i18n="rankedby">Ranked by</div><input id="rankedby" placeholder="Your name or alias"></div>
      <div class="pair"><div class="label" data-i18n="cover">Cover</div><input id="cover" type="file" accept="image/*"></div>
      <div class="pair"><div class="label" data-i18n="trackcount">Tracks</div><input id="trackcount" type="number" min="1" value="7"></div>

      <div class="controls">
        <button id="applyCount">Apply Track Count</button>
        <button id="addRow">+ Add Row</button>
        <button id="delRow">– Remove Last</button>
        <button id="clearScores">Clear Score</button>
        <span class="badge" title="Unscored tracks are '-'">
          <span class="badge-dot"></span>
          Unscored = '-'
        </span>
      </div>

      <div class="row" style="font-size:12px;color:#aeb5c0">
        <div data-i18n="num">#</div>
        <div data-i18n="duration">Duration</div>
        <div data-i18n="name">Name</div>
        <div data-i18n="score">Score (int + decimal)</div>
        <div data-i18n="color">Color</div>
        <div class="small">✎</div>
      </div>

      <div id="tracks"></div>
      <div class="small" style="margin-top:6px">Tip: use the pen button to add a note for each track.</div>
    </div>

    <div class="card pad">
      <div style="display:grid;grid-template-columns:1fr 360px;gap:16px">
        <div>
          <div id="info" style="display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:6px;align-items:center"></div>
          <table id="table"></table>
        </div>
        <div>
          <img id="coverOut" class="cover" alt="Cover">
          <div class="final" id="finalScore">—</div>
        </div>
      </div>

      <div style="margin-top:12px">
        <div style="font-size:12px;color:#aeb5c0;margin:6px 0">Enjoyment Timeline</div>
        <canvas id="chart" width="900" height="360"></canvas>
      </div>

      <!-- Notes & Review -->
      <div id="notesSection" class="card pad" style="margin-top:12px">
        <div style="font-size:12px;color:#aeb5c0;margin-bottom:6px">Notes & Review</div>
        <div id="notesOutput" style="white-space:pre-wrap; line-height:1.5; font-size:14px"></div>
        <div style="margin-top:10px">
          <div class="label">Final Album Thoughts</div>
          <textarea id="finalNotes" rows="4" placeholder="Write your closing thoughts..." style="width:100%;background:#0e1218;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px"></textarea>
        </div>
      </div>

      <div class="footer">Created by Ok Pretty Boy with help from ChatGPT</div>
    </div>
  </div>
</div>

<!-- Library modal -->
<div id="libModal">
  <div id="libCard">
    <div class="libToolbar">
      <strong>My Library</strong>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="libSort">
          <option value="desc">Higher score first</option>
          <option value="asc">Lower score first</option>
          <option value="new">Newest first</option>
          <option value="old">Oldest first</option>
        </select>
        <button id="libClose">Close</button>
      </div>
    </div>
    <div id="libGrid" class="libGrid"></div>
  </div>
</div>

<script>
/* ========= CONFIG ========= */
const SUPABASE_URL = "https://dfnrrkopmdnkpsrxlqew.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmbnJya29wbWRua3BzcnhscWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAyNzA5NjYsImV4cCI6MjA3NTg0Njk2Nn0.Z3Bl1xfV943MBSW068AlDaN74XxIwsbsILKEE2ECse8";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
/* ========================= */

const COLORS = {10:'#2e47ee',9:'#0285c6',8:'#02aec6',7:'#23be32',6:'#f0ca15',5:'#e12928'};
const NEUTRAL = '#2a3140';
const $ = s => document.querySelector(s);
const tracksEl = () => document.getElementById('tracks');

/* ===== Top10 toggle ===== */
const SORT_STATE = { active:false, snapshot:null };
function setSortButton(active){
  const btn = document.getElementById('sortTop10');
  if(btn) btn.textContent = active ? 'Restore album order' : 'Sort Top 10';
}

/* ===== Helpers ===== */
function durationToSeconds(d){ if(!d) return 0; const m=d.match(/^(\d{1,2}):(\d{2})$/); if(!m) return 0; return parseInt(m[1],10)*60+parseInt(m[2],10); }
function secondsToMinutesText(s){ const m=Math.round(s/60); return m? m+' min':'—'; }
function colorFor(score){ if(!Number.isFinite(score)) return NEUTRAL; const k=Math.max(5,Math.min(10,Math.floor(Number(score)||0))); return COLORS[k]; }
function avgScore(tracks){ const v=(tracks||[]).map(t=>t.score).filter(Number.isFinite); return v.length?(v.reduce((a,b)=>a+b,0)/v.length):NaN; }
function safeName(s){ return (s||'').replace(/[\\/:*?"<>|]+/g,'').trim().replace(/\s+/g,' '); }

/* ===== Score picker with “-” ===== */
function rankPicker(initial){
  const wrap=document.createElement('div'); wrap.style.display='grid'; wrap.style.gridTemplateColumns='1fr 1fr'; wrap.style.gap='6px';
  const iSel=document.createElement('select'); let o=document.createElement('option'); o.value=''; o.textContent='-'; iSel.appendChild(o);
  for(let i=5;i<=10;i++){ o=document.createElement('option'); o.value=i; o.textContent=i; iSel.appendChild(o); }
  const dSel=document.createElement('select'); dSel.disabled=true;
  function fillDec(max){ dSel.innerHTML=''; let o2=document.createElement('option'); o2.value='0'; o2.textContent='0.0'; dSel.appendChild(o2); if(max){ for(let t=1;t<=9;t++){ const val=(t/10).toFixed(1); o2=document.createElement('option'); o2.value=val; o2.textContent=val; dSel.appendChild(o2);} } }
  fillDec(false);
  function setFromNumber(v){ if(!Number.isFinite(v)){ iSel.value=''; dSel.disabled=true; dSel.value='0'; return; } const b=Math.floor(v); const dec=Math.round((v-b)*10)/10; iSel.value=String(b); dSel.disabled=false; fillDec(b<10); dSel.value=dec.toFixed(1); }
  function current(){ const ib=iSel.value; if(ib==='') return NaN; const dd=parseFloat(dSel.value||'0'); return parseFloat(ib)+dd; }
  function trigger(){ wrap.dispatchEvent(new CustomEvent('change-score',{detail:current()})); }
  iSel.addEventListener('change', ()=>{ if(iSel.value===''){ dSel.disabled=true; dSel.value='0'; } else { dSel.disabled=false; fillDec(Number(iSel.value)<10); } trigger(); });
  dSel.addEventListener('change', trigger);
  setFromNumber(initial);
  wrap.append(iSel,dSel);
  return {el:wrap,get:current,set:setFromNumber};
}

/* ===== Row + notes button ===== */
const NOTES_KEY = "albumrater_v6_notes";
function getNotesBucketKey(){ const s=getState(); return `${safeName(s.album||'Album')}__${safeName(s.artist||'Artist')}`; }
function loadAllNotes(){ try{ return JSON.parse(localStorage.getItem(NOTES_KEY)||"{}"); }catch{ return {}; } }
function saveAllNotes(n){ localStorage.setItem(NOTES_KEY, JSON.stringify(n)); }
function getNotes(){ const all=loadAllNotes(); return all[getNotesBucketKey()] || { trackNotes:{}, final:"" }; }
function setNotes(obj){ const all=loadAllNotes(); all[getNotesBucketKey()]=obj; saveAllNotes(all); renderNotesOutput(); }

function makeRow(i,data={}){
  const row=document.createElement('div'); row.className='row';
  const n=document.createElement('input'); n.type='number'; n.min=1; n.value=(data.n ?? (i+1));
  const dur=document.createElement('input'); dur.placeholder='mm:ss'; dur.value=data.dur||'';
  const name=document.createElement('input'); name.placeholder='Track name'; name.value=data.name||'';
  const initScore = (typeof data.score==='number' && Number.isFinite(data.score)) ? data.score : NaN;
  const picker=rankPicker(initScore); const pill=document.createElement('div'); pill.className='pill'; pill.textContent='-'; pill.style.background=NEUTRAL;

  const noteBtn=document.createElement('button');
  noteBtn.type='button'; noteBtn.className='noteBtn'; noteBtn.title='Add note';
  noteBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.33h-.5v-.5l9.06-9.06.5.5L5.92 19.58zM20.71 7.04a1.003 1.003 0 000-1.42l-2.34-2.34a1.003 1.003 0 00-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/></svg>';

  row.append(n,dur,name,picker.el,pill,noteBtn);

  function paint(v){ if(!Number.isFinite(v)){ pill.style.background=NEUTRAL; pill.textContent='-'; return; } const c=colorFor(v); pill.style.background=c; pill.textContent=(v||0).toFixed(1).replace(/\.0$/,''); }
  picker.el.addEventListener('change-score', e=>{ paint(e.detail); render(); });
  [n,dur,name].forEach(el=> el.addEventListener('input', render));
  paint(picker.get());

  // note button
  const bucket=getNotes(); const existing=bucket.trackNotes[i]||"";
  noteBtn.classList.toggle('active', !!existing);
  noteBtn.addEventListener('click', ()=>{
    const prev=(getNotes().trackNotes[i]||"");
    const text=prompt('Write a note for this track:', prev == null ? "" : String(prev));
    if(text==null) return;
    const nb=getNotes(); nb.trackNotes[i]=text.trim(); setNotes(nb);
    noteBtn.classList.toggle('active', !!nb.trackNotes[i]);
  });

  row.value=()=>({n:Number(n.value||0), dur:dur.value.trim(), name:name.value.trim(), score:picker.get()});
  return row;
}

function ensureRows(n){
  const el = tracksEl(); const cur=el.children.length;
  if(cur<n){for(let i=cur;i<n;i++) el.appendChild(makeRow(i));}
  else if(cur>n){for(let i=cur-1;i>=n;i--) el.removeChild(el.children[i]);}
  render();
}

/* ===== State ===== */
const KEY='albumrater_v6_state';
function getState(){
  const el = tracksEl(); const tracks=[...el.children].map(r=>r.value()).filter(t=>t.name||t.dur||Number.isFinite(t.score));
  return { album:$('#album').value.trim(), artist:$('#artist').value.trim(), released:$('#released').value.trim(), rankedby:$('#rankedby').value.trim(), cover:$('#coverOut').src||'', tracks };
}
function setState(s){
  $('#album').value=s.album||''; $('#artist').value=s.artist||''; $('#released').value=s.released||''; $('#rankedby').value=s.rankedby||'';
  if(s.cover) $('#coverOut').src=s.cover;
  const el = tracksEl(); el.innerHTML=''; (s.tracks||[]).forEach((t,i)=> el.appendChild(makeRow(i,{n:t.n,dur:t.dur,name:t.name,score:(typeof t.score==='number'?t.score:NaN)})));
  if(!(s.tracks||[]).length) ensureRows(7);
  // reset sort toggle
  SORT_STATE.active=false; SORT_STATE.snapshot=null; setSortButton(false);
  render();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(getState())); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ setState(JSON.parse(raw)); return; }
  }catch(e){}
  ensureRows(7); render();
}

/* ===== Render + chart ===== */
function render(){
  const info=document.getElementById('info'); if(!info) return; info.innerHTML='';
  const pair=(L,V)=>{const l=document.createElement('div'); l.className='label'; l.textContent=L; const v=document.createElement('div'); v.innerHTML=V; info.append(l,v);};
  const album=$('#album').value.trim(), artist=$('#artist').value.trim(), released=$('#released').value.trim(), rankedby=$('#rankedby').value.trim();
  pair('Album:','<strong><em>'+(album||'—')+'</em></strong>'); pair('Artist:','<strong>'+(artist||'—')+'</strong>'); pair('Release Date:',released||'—'); if(rankedby) pair('Ranked by:', rankedby);

  const el = tracksEl(); const tracks=[...el.children].map(r=>r.value()).filter(tr=>tr.name||tr.dur||Number.isFinite(tr.score)).sort((a,b)=>a.n-b.n);
  const table=document.getElementById('table'); table.innerHTML=''; const thead=document.createElement('thead'); thead.innerHTML='<tr><th style="width:80px">Duration</th><th style="width:36px">#</th><th>Name</th><th style="width:90px">Score</th></tr>'; table.appendChild(thead);
  const tbody=document.createElement('tbody'); table.appendChild(tbody);
  let totalSec=0, scores=[]; tracks.forEach(tr=>{ totalSec+=durationToSeconds(tr.dur); if(Number.isFinite(tr.score) && tr.score>=5&&tr.score<=10) scores.push(tr.score);
    const badge = Number.isFinite(tr.score) ? ('<span class="pill" style="background:'+colorFor(tr.score)+'">'+tr.score.toFixed(1).replace(/\.0$/,'')+'</span>') : ('<span class="pill" style="background:'+NEUTRAL+'">-</span>');
    const el=document.createElement('tr'); el.innerHTML='<td>'+(tr.dur||'—')+'</td><td>'+(tr.n||'')+'</td><td>'+(tr.name||'—')+'</td><td>'+badge+'</td>'; tbody.appendChild(el); });
  const avg=scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length):NaN; document.getElementById('finalScore').textContent=Number.isFinite(avg)?avg.toFixed(1):'—';
  pair('Duration', secondsToMinutesText(totalSec));
  const series = tracks.map(tr=>tr.score).filter(v=>Number.isFinite(v));
  drawChart('chart', series);
  renderNotesOutput();
  save();
}
function drawChart(id,values){
  const canvas=document.getElementById(id); if(!canvas) return; const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  const P={l:60,r:20,t:20,b:36}, W=canvas.width-P.l-P.r, H=canvas.height-P.t-P.b;
  ctx.strokeStyle='#2a3140'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(P.l,P.t); ctx.lineTo(P.l,P.t+H); ctx.lineTo(P.l+W,P.t+H); ctx.stroke();
  ctx.fillStyle='#aeb5c0'; ctx.font='12px system-ui';
  for(let y=5;y<=10;y++){ const yy=P.t+H-((y-5)/5)*H; ctx.strokeStyle='#1a2130'; ctx.beginPath(); ctx.moveTo(P.l,yy); ctx.lineTo(P.l+W,yy); ctx.stroke(); ctx.fillText(String(y),18,yy+4); }
  if(!values.length) return; const n=values.length, x=i=>P.l+(i/(Math.max(1,n-1)))*W, y=v=>P.t+H-((v-5)/5)*H;
  ctx.strokeStyle='rgba(122,162,255,0.95)'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x(0),y(values[0])); for(let i=1;i<n;i++) ctx.lineTo(x(i), y(values[i])); ctx.stroke();
  ctx.fillStyle='#cfd9ff'; for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(x(i), y(values[i]), 5, 0, 2*Math.PI); ctx.fill(); }
  ctx.fillStyle='#aeb5c0'; for(let i=0;i<n;i++){ ctx.fillText(String(i+1), x(i)-3, P.t+H+16); }
}

/* ===== Notes output ===== */
function renderNotesOutput(){
  const out = $('#notesOutput'); if(!out) return;
  const s = getState(); const notes = getNotes();
  const lines=[]; const tracks=s.tracks||[];
  tracks.forEach((t,i)=>{ const note=notes.trackNotes[i]; if(note && note.trim()){ const name=t?.name||`Track ${i+1}`; lines.push(`${i+1}. ${name}: ${note.trim()}`);} });
  const albumTitle = s.album ? `${s.album} by ${s.artist||""}`.trim() : "";
  const header = albumTitle ? albumTitle+"\n" : "";
  const final = notes.final||"";
  const finalBlock = final.trim()? `\nFinal Album Thoughts: ${final.trim()}` : "";
  out.textContent = header + lines.join("\n") + finalBlock;
}
$('#finalNotes')?.addEventListener('input', ()=>{
  const n=getNotes(); n.final=$('#finalNotes').value||""; setNotes(n);
});

/* ===== Autofill (MB + iTunes cover fallback-lite) ===== */
let lastFetchTs=0;
async function safeFetch(url,opts={}){ const now=Date.now(); const wait=Math.max(0,800-(now-lastFetchTs)); if(wait) await new Promise(r=>setTimeout(r,wait)); lastFetchTs=Date.now(); return fetch(url,opts); }
function mmss(ms){ if(!Number.isFinite(ms)||ms<=0) return ''; const s=Math.floor(ms/1000); const m=Math.floor(s/60); const r=s%60; return `${m}:${String(r).padStart(2,'0')}`; }

async function searchReleasesMB(artist, album){
  const queryStr=encodeURIComponent(`release:${album} AND artist:${artist}`);
  const url=`https://musicbrainz.org/ws/2/release/?query=${queryStr}&fmt=json&limit=7`;
  const res=await safeFetch(url); if(!res.ok) throw new Error('MB search failed');
  const data=await res.json();
  return (data.releases||[]).map(r=>({ id:r.id,title:r.title||'',score:r.score||0,country:r.country||'',date:r.date||'',trackCount:r['track-count']||'', artistCredit:(r['artist-credit']||[]).map(a=>a.name).join(', ') })).sort((a,b)=>b.score-a.score);
}
async function fetchReleaseMB(id){
  const url=`https://musicbrainz.org/ws/2/release/${id}?fmt=json&inc=recordings+media`;
  const res=await safeFetch(url); if(!res.ok) throw new Error('MB release failed');
  const data=await res.json();
  const tracks=[]; (data.media||[]).forEach(m=> (m.tracks||[]).forEach(t=> tracks.push({title:t.title, duration:t.length? mmss(t.length): ''})));
  const totalMs=(data.media||[]).reduce((acc,m)=> acc+(m.tracks||[]).reduce((a,t)=> a+(t.length||0),0),0);
  return { title:data.title||'', artist:(data['artist-credit']||[]).map(a=>a.name).join(', '), year:(data.date||'').slice(0,4), trackCount:tracks.length, tracks, totalTime: totalMs? mmss(totalMs): '' , id:data.id };
}
async function fetchCoverMB(releaseId){
  const meta=await safeFetch(`https://coverartarchive.org/release/${releaseId}`); if(!meta.ok) return null;
  const json=await meta.json().catch(()=>null);
  const big=json?.images?.find(i=>i.thumbnails?.large)||json?.images?.[0];
  return big?.image || big?.thumbnails?.large || null;
}
function fillDOM(payload){
  if(payload.title) $('#album').value=payload.title;
  if(payload.artist) $('#artist').value=payload.artist;
  if(payload.year) $('#released').value=payload.year;
  if(payload.trackCount) $('#trackcount').value=String(payload.trackCount);
  if(payload.coverUrl) $('#coverOut').src=payload.coverUrl;
}
async function runAutofill(){
  const artist=$('#artist').value.trim(); const album=$('#album').value.trim();
  if(!artist||!album){ alert('Type artist and album first.'); return; }
  try{
    const cands=await searchReleasesMB(artist, album);
    if(!cands.length) throw new Error('no results');
    // take best match (first)
    const pick=cands[0];
    const base=await fetchReleaseMB(pick.id);
    const coverUrl=await fetchCoverMB(pick.id);
    const payload={ title: base.title, artist: base.artist, year: base.year, trackCount: base.trackCount, totalTime: base.totalTime, coverUrl, tracks: base.tracks };
    fillDOM(payload);
    window.dispatchEvent(new CustomEvent('album-autofilled',{detail:payload}));
  }catch(e){
    alert('No automatic results. Fill manually.');
  }
}
document.getElementById('btnBuscarAlbum').addEventListener('click', runAutofill);

/* ===== Wire core controls ===== */
document.getElementById('addRow').addEventListener('click', ()=> ensureRows(tracksEl().children.length+1));
document.getElementById('delRow').addEventListener('click', ()=> ensureRows(Math.max(1, tracksEl().children.length-1)));
document.getElementById('applyCount').addEventListener('click', ()=> ensureRows(parseInt(document.getElementById('trackcount').value||'1',10)));
document.getElementById('cover').addEventListener('change',ev=>{const f=ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=e=>{$('#coverOut').src=e.target.result; save();}; r.readAsDataURL(f);});
document.getElementById('clearScores').addEventListener('click', ()=>{ const s=getState(); s.tracks=(s.tracks||[]).map(t=>({...t,score:NaN})); setState(s); save(); });

/* ===== Sort Top 10 toggle (with restore) ===== */
document.getElementById('sortTop10').addEventListener('click', ()=>{
  const el=tracksEl();
  if(!SORT_STATE.active){
    SORT_STATE.snapshot=[...el.children].map(r=>r.value());
    const arr=SORT_STATE.snapshot.map(x=>({...x}));
    const scored=arr.filter(t=>Number.isFinite(t.score));
    const un=arr.filter(t=>!Number.isFinite(t.score));
    scored.sort((a,b)=>b.score-a.score);
    const top=scored.slice(0,10); const rest=scored.slice(10).concat(un);
    const merged=top.concat(rest).map((t,i)=>({...t,n:i+1}));
    el.innerHTML=''; merged.forEach((t,i)=> el.appendChild(makeRow(i,t)));
    SORT_STATE.active=true; setSortButton(true); render(); return;
  }
  if(SORT_STATE.snapshot){
    const original=SORT_STATE.snapshot.map(x=>({...x}));
    el.innerHTML=''; original.forEach((t,i)=> el.appendChild(makeRow(i,t)));
  }
  SORT_STATE.active=false; SORT_STATE.snapshot=null; setSortButton(false); render();
});
setSortButton(SORT_STATE.active);

/* ===== Export / Import / Clear ===== */
document.getElementById('exportJSON').addEventListener('click', ()=>{
  try{
    const s=getState(), notes=getNotes(), payload={...s, notes};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const album=safeName(s.album||'Album'), artist=safeName(s.artist||'');
    const fname= artist ? `${album} - ${artist}.json` : `${album}.json`;
    const a=document.createElement('a'); a.href=url; a.download=fname; a.click(); URL.revokeObjectURL(url);
  }catch(e){ alert('Could not export.'); }
});
document.getElementById('importJSON').addEventListener('change', ev=>{
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const obj=JSON.parse(e.target.result);
      setState(obj); save();
      if(obj && obj.notes){ setNotes({ trackNotes: obj.notes.trackNotes||{}, final: obj.notes.final||"" }); const ta=$('#finalNotes'); if(ta) ta.value=obj.notes.final||""; }
      alert('Imported.');
    }catch{ alert('Invalid file.'); }
  };
  r.readAsText(f); ev.target.value='';
});
document.getElementById('clearAll').addEventListener('click', ()=>{
  if(!confirm('Are you sure you want to clear all fields?')) return;
  localStorage.removeItem(KEY);
  setState({ album:'', artist:'', released:'', rankedby:'', cover:'', tracks:[] });
});

/* ===== Library (Supabase) ===== */
async function currentUser(){
  const { data } = await supabase.auth.getUser();
  return data.user || null;
}
function requireAuthHint(){
  alert('Please sign in first (GitHub).'); 
}
async function saveToLibrary(){
  const user=await currentUser(); if(!user) return requireAuthHint();
  const s=getState();
  const average = avgScore(s.tracks);
  const row={
    user_id: user.id,
    album: s.album||'',
    artist: s.artist||'',
    released: s.released||'',
    cover: s.cover||'',
    avg: Number.isFinite(average) ? average : null,
    tracks: s.tracks||[],
  };
  const { error } = await supabase.from('albums').insert(row);
  if(error){ console.error(error); alert('Could not save. Check database permissions.'); }
  else { alert('Saved to library!'); }
}
async function openLibrary(){
  const user=await currentUser(); if(!user) return requireAuthHint();
  $('#libModal').style.display='flex';
  await loadLibrary('desc');
}
async function loadLibrary(order='desc'){
  const user=await currentUser(); if(!user) return;
  let query=supabase.from('albums').select('*').eq('user_id', user.id);
  if(order==='desc') query=query.order('avg', { ascending:false, nullsFirst:false }).order('created_at',{ascending:false});
  if(order==='asc')  query=query.order('avg', { ascending:true, nullsLast:true }).order('created_at',{ascending:false});
  if(order==='new')  query=query.order('created_at',{ascending:false});
  if(order==='old')  query=query.order('created_at',{ascending:true});
  const { data, error } = await query.limit(200);
  if(error){ console.error(error); alert('Could not load library.'); return; }
  const grid=$('#libGrid'); grid.innerHTML='';
  (data||[]).forEach(row=>{
    const div=document.createElement('div'); div.className='libItem';
    const img=document.createElement('img'); img.className='libCover'; img.src=row.cover||''; img.alt='';
    const meta=document.createElement('div');
    const title=document.createElement('div'); title.className='libTitle'; title.textContent=row.album||'—';
    const sub=document.createElement('div'); sub.className='libMeta'; sub.textContent=(row.artist||'') + (row.released? ` · ${row.released}`:'');
    meta.append(title, sub);
    const score=document.createElement('div'); score.className='libScore'; score.textContent= row.avg!=null ? (Math.round(row.avg*10)/10).toFixed(1) : '—';
    div.append(img,meta,score);
    div.addEventListener('click', ()=>{
      const state={ album:row.album, artist:row.artist, released:row.released, rankedby:$('#rankedby').value||'', cover:row.cover, tracks:row.tracks||[] };
      setState(state); save(); $('#libModal').style.display='none';
    });
    grid.appendChild(div);
  });
}
document.getElementById('btnSaveLib').addEventListener('click', saveToLibrary);
document.getElementById('btnShowLib').addEventListener('click', openLibrary);
document.getElementById('libClose').addEventListener('click', ()=> $('#libModal').style.display='none');
document.getElementById('libSort').addEventListener('change', (e)=> loadLibrary(e.target.value));

/* ===== Auth UI ===== */
async function refreshAuthUI(){
  const user=await currentUser();
  $('#btnLogin').style.display = user ? 'none' : 'inline-block';
  $('#btnLogout').style.display = user ? 'inline-block' : 'none';
}
document.getElementById('btnLogin').addEventListener('click', async ()=>{
  const { data, error } = await supabase.auth.signInWithOAuth({ provider: 'github', options: { redirectTo: location.href }});
  if(error) alert('Sign-in failed.');
});
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  await supabase.auth.signOut(); await refreshAuthUI();
});
supabase.auth.onAuthStateChange((_event, _session)=>{ refreshAuthUI(); });

/* ===== Boot ===== */
function boot(){
  // base wiring
  load();

  // autofill filled callback: write rows + reset sort
  window.addEventListener('album-autofilled',(e)=>{
    const d=e.detail||{}; const list=d.tracks||[];
    document.getElementById('trackcount').value = list.length || document.getElementById('trackcount').value;
    ensureRows(list.length || document.getElementById('tracks').children.length);
    [...document.getElementById('tracks').children].forEach((row,i)=>{
      const inputs=row.querySelectorAll('input'); const t=list[i]||{};
      if(inputs[1]) inputs[1].value=t.duration||''; if(inputs[2]) inputs[2].value=t.title||'';
    });
    if(d.year) document.getElementById('released').value=d.year;
    SORT_STATE.active=false; SORT_STATE.snapshot=null; setSortButton(false);
    render();
  });

  refreshAuthUI();
}
boot();
</script>
