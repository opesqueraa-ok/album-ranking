<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Album Ranking</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    :root { --gap: 10px; --bg:#0b0b0c; --card:#121317; --text:#eef; --muted:#9aa; --accent:#7dd3fc; }
    html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { display:flex; align-items:center; gap:var(--gap); padding:12px 14px; background:#0f1115; position:sticky; top:0; z-index:10; border-bottom:1px solid #1b1e25; }
    header .spacer { flex:1; }
    button, label.btn, .ghost { background:#1a1f2a; color:var(--text); border:1px solid #283043; border-radius:8px; padding:8px 12px; cursor:pointer; }
    button:hover, label.btn:hover { background:#202836; }
    .muted { color:var(--muted); }
    main { padding:18px; max-width:1100px; margin:0 auto; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid #1b1e25; border-radius:10px; overflow:hidden; }
    th, td { padding:10px 12px; border-bottom:1px solid #1b1e25; }
    thead th { background:#151821; text-align:left; color:#cbd5e1; font-weight:600; }
    tbody tr:hover { background:#111521; }
    /* Alineaciones pedidas */
    .col-average, .col-tracks, .col-open { text-align:center; width:110px; white-space:nowrap; }
    .col-cover { width:64px; }
    .cover { width:44px; height:44px; object-fit:cover; border-radius:6px; display:block; }
    /* barra de acciones */
    .actions { display:flex; gap:8px; align-items:center; }
    input[type="file"] { display:none; }
    /* estado auth */
    #authStatus { color:var(--accent); font-weight:600; }
  </style>
</head>
<body>
  <header>
    <strong>🎧 Album Ranking</strong>

    <div class="spacer"></div>

    <div class="actions">
      <!-- Botón Biblioteca (solo visible con sesión) -->
      <button id="btnLibrary" title="Abrir mi librería">📚 Library</button>

      <!-- Export / Import -->
      <button id="btnExportLibrary" title="Exportar mi librería a JSON">⬇️ Export</button>
      <input id="fileImport" type="file" accept="application/json" />
      <label for="fileImport" class="btn" title="Importar librería desde JSON">⬆️ Import</label>

      <!-- Auth -->
      <span id="authStatus" class="muted" style="display:none"></span>
      <button id="btnSignIn">Sign in</button>
      <button id="btnSignOut" style="display:none">Sign out</button>
    </div>
  </header>

  <main>
    <table id="tbl">
      <thead>
        <tr>
          <th class="col-cover">Cover</th>
          <th>Album</th>
          <th>Artist</th>
          <th>Released</th>
          <th class="col-average">Average</th><!-- <- renombrado -->
          <th class="col-tracks">Tracks</th>
          <th class="col-open">Open</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <!-- filas dinámicas -->
      </tbody>
    </table>
  </main>
