<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest?v=7.0">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7.0">
<link rel="icon" href="favicon.png?v=7.0">
<meta name="theme-color" content="#0f1115">
<title>Album Rater</title>
<style>
:root{--c10:#2e47ee;--c9:#0285c6;--c8:#02aec6;--c7:#23be32;--c6:#f0ca15;--c5:#e12928;--bg:#0f1115;--panel:#161a22;--ink:#e9edf1;--muted:#aeb5c0;--line:#2a3140;--neutral:#2a3140}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;margin:0}
.wrap{max-width:1100px;margin:18px auto;padding:0 16px 80px}
h1{font-size:20px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.select,input,select,button{background:#0e1218;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px}
button{cursor:pointer;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pad{padding:14px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.pair{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.label{font-size:13px;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.row{display:grid;grid-template-columns:60px 90px 1fr 160px 90px 36px;gap:8px;align-items:center;margin-bottom:6px}
.noteBtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:#0e1218;color:var(--ink);cursor:pointer}
.noteBtn.active{outline:2px solid #3b82f6}
.pill{display:inline-flex;justify-content:center;align-items:center;padding:6px 10px;border-radius:8px;color:white;font-weight:800;min-width:52px;text-align:center}
.cover{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid var(--line);border-radius:10px;background:#0d1117}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;font-size:14px}
th{color:var(--muted);font-weight:600}
.final{font-size:52px;font-weight:800;text-align:center;margin-top:10px}
canvas{width:100%;height:320px;border:1px solid var(--line);border-radius:12px;background:#0e1218}
.footer{margin-top:10px;font-size:12px;color:#93a0b6}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#c9d3e3}
.badge-dot{width:8px;height:8px;border-radius:999px;background:var(--neutral);display:inline-block}

/* Library modal */
#libModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:9999}
#libBox{width:min(980px,94vw);max-height:90vh;overflow:auto;background:#0f1115;border:1px solid var(--line);border-radius:14px}
#libHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
#libGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px}
@media (max-width:900px){#libGrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){#libGrid{grid-template-columns:1fr}}
.libCard{background:#161a22;border:1px solid #2a3140;border-radius:12px;padding:10px;display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center}
.libCard img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#0d1117}
.libTitle{font-weight:700}
.libMeta{font-size:12px;color:#aeb5c0}
.libRow{display:flex;gap:6px;flex-wrap:wrap}
.libBtn{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#0e1218;color:#e9edf1;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <h1 style="margin-right:auto">Album Rater</h1>

    <button id="btnSaveCloud" title="Save album to your library (cloud)">Save to Library</button>
    <button id="btnOpenLibrary" title="Browse your saved albums">My Library</button>

    <select id="lang" class="select">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
    <button id="exportJSON">Export Data</button>
    <label style="position:relative">
      <span id="importLabel" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;display:inline-block">Import Data</span>
      <input id="importJSON" type="file" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer">
    </label>
    <button id="clearAll">Clear All Data</button>
    <button id="sortTop10">Sort Top 10</button>

    <span style="margin-left:auto;display:inline-flex;gap:8px;align-items:center">
      <span id="authStatus" style="font-size:12px;color:#aeb5c0">Not signed in</span>
      <button id="btnSignIn">Sign in</button>
      <button id="btnSignOut" style="display:none">Sign out</button>
    </span>
  </div>

  <div class="sub" id="subtitle"></div>

  <div class="grid">
    <div class="card pad">
      <div class="pair">
        <div class="label" data-i18n="album">Album</div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="album" placeholder="Album name">
          <button id="btnBuscarAlbum" type="button">Buscar info</button>
        </div>
      </div>
      <div class="pair"><div class="label" data-i18n="artist">Artist</div><input id="artist" placeholder="Artist"></div>
      <div class="pair"><div class="label" data-i18n="released">Release Date</div><input id="released" placeholder="Aug 1, 2025"></div>
      <div class="pair"><div class="label" data-i18n="rankedby">Ranked by</div><input id="rankedby" placeholder="Your name or alias"></div>
      <div class="pair"><div class="label" data-i18n="cover">Cover</div><input id="cover" type="file" accept="image/*"></div>
      <div class="pair"><div class="label" data-i18n="trackcount">Tracks</div><input id="trackcount" type="number" min="1" value="7"></div>

      <div class="controls">
        <button id="applyCount">Apply Track Count</button>
        <button id="addRow">+ Add Row</button>
        <button id="delRow">– Remove Last</button>
        <button id="clearScores">Clear Score</button>
        <span class="badge" title="Unscored tracks are '-'">
          <span class="badge-dot"></span>
          Unscored = '-'
        </span>
      </div>

      <div class="row" style="font-size:12px;color:#aeb5c0">
        <div data-i18n="num">#</div>
        <div data-i18n="duration">Duration</div>
        <div data-i18n="name">Name</div>
        <div data-i18n="score">Score (int + decimal)</div>
        <div data-i18n="color">Color</div>
      </div>
      <div id="tracks"></div>
    </div>

    <div class="card pad">
      <div style="display:grid;grid-template-columns:1fr 360px;gap:16px">
        <div>
          <div id="info" style="display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:6px;align-items:center"></div>
          <table id="table"></table>
        </div>
        <div>
          <img id="coverOut" class="cover" alt="Cover">
          <div class="final" id="finalScore">—</div>
        </div>
      </div>

      <div style="margin-top:12px">
        <div style="font-size:12px;color:#aeb5c0;margin:6px 0">Enjoyment Timeline</div>
        <canvas id="chart" width="900" height="360"></canvas>
      </div>

      <!-- Notes & Review -->
      <div id="notesSection" class="card pad" style="margin-top:12px">
        <div style="font-size:12px;color:#aeb5c0;margin-bottom:6px">Notes & Review</div>
        <div id="notesOutput" style="white-space:pre-wrap; line-height:1.5; font-size:14px"></div>
        <div style="margin-top:10px">
          <div class="label">Final Album Thoughts</div>
          <textarea id="finalNotes" rows="4" placeholder="Write your closing thoughts..." style="width:100%;background:#0e1218;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px"></textarea>
        </div>
      </div>

      <div class="footer">Created by Ok Pretty Boy with help from ChatGPT</div>
    </div>
  </div>
</div>

<!-- Library Modal -->
<div id="libModal">
  <div id="libBox">
    <div id="libHead">
      <div style="display:flex;gap:8px;align-items:center">
        <strong>My Library</strong>
        <select id="libSort" class="select" style="padding:6px 10px">
          <option value="top">Top rated</option>
          <option value="low">Lowest rated</option>
          <option value="new">Newest</option>
          <option value="az">A–Z</option>
        </select>
      </div>
      <button id="libClose" class="libBtn">Close</button>
    </div>
    <div id="libGrid"></div>
  </div>
</div>

<!-- Supabase client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- App scripts (ya existentes en tu repo) -->
<script defer src="autofillAlbum.v6.5.js?v=7.0"></script>
<script defer src="ui.v6.5.js?v=7.0"></script>
<script defer src="sw-register.v6.5.js"></script>

<!-- Supabase wiring -->
<script>
  // === CONFIG proporcionada por ti ===
  window.SUPABASE_URL = "https://dfnrrkopmdnkpsrxlqew.supabase.co";
  window.SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRmbnJya29wbWRua3BzcnhscWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAyNzA5NjYsImV4cCI6MjA3NTg0Njk2Nn0.Z3Bl1xfV943MBSW068AlDaN74XxIwsbsILKEE2ECse8";

  const supa = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

  const $ = (s) => document.querySelector(s);
  const NOTES_KEY = "albumrater_v6_notes";

  function safeName(s){return (s||"").replace(/[\\/:*?"<>|]+/g,"").trim().replace(/\s+/g," ");}

  function getNotesForCurrent(){
    try{
      const all = JSON.parse(localStorage.getItem(NOTES_KEY) || "{}");
      const s = window.AlbumApp.getState();
      const key = `${safeName(s.album||"Album")}__${safeName(s.artist||"Artist")}`;
      return all[key] || { trackNotes:{}, final:"" };
    }catch{ return { trackNotes:{}, final:"" }; }
  }

  function computeAvgScore(tracks){
    const vals = (tracks||[]).map(t=>t.score).filter(v=>Number.isFinite(v));
    if(!vals.length) return null;
    const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
    return Math.round(avg*10)/10;
  }

  async function ensureSignedIn(){
    const { data: { user } } = await supa.auth.getUser();
    if(user) return user;
    const email = prompt("Enter your email to sign in (magic link)");
    if(!email) throw new Error("Email required");
    const redirectTo = location.origin + location.pathname; // tu GitHub Pages URL actual
    const { error } = await supa.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo }});
    if(error) throw error;
    alert("We sent you a magic link. Open it to finish sign-in, then come back here.");
    throw new Error("Pending email verification");
  }

  function setAuthUI(user){
    const authStatus = $("#authStatus");
    const btnIn = $("#btnSignIn");
    const btnOut = $("#btnSignOut");
    if(user){
      authStatus.textContent = user.email || "Signed in";
      btnIn.style.display = "none";
      btnOut.style.display = "inline-block";
    }else{
      authStatus.textContent = "Not signed in";
      btnIn.style.display = "inline-block";
      btnOut.style.display = "none";
    }
  }

  async function refreshAuthUI(){
    const { data: { user } } = await supa.auth.getUser();
    setAuthUI(user);
  }

  async function uploadCoverIfNeeded(userId, coverSrc, album, artist){
    if(!coverSrc) return null;
    if(!coverSrc.startsWith("data:")) return coverSrc; // URL ya pública

    // subir a storage público
    const path = `${userId}/${Date.now()}_${safeName(album||"")}-${safeName(artist||"")}.png`;
    const base64 = coverSrc.split(",")[1];
    const blob = await (await fetch(coverSrc)).blob(); // convierte dataURL a blob

    const { error: upErr } = await supa.storage.from("covers").upload(path, blob, {
      contentType: blob.type || "image/png",
      upsert: false
    });
    if(upErr){ console.warn(upErr); return null; }

    const { data } = supa.storage.from("covers").getPublicUrl(path);
    return data?.publicUrl || null;
  }

  async function saveToLibrary(){
    try{
      const user = await ensureSignedIn();
      const s = window.AlbumApp.getState();
      const notes = getNotesForCurrent();
      const avg = computeAvgScore(s.tracks);

      const coverUrl = await uploadCoverIfNeeded(user.id, s.cover, s.album, s.artist) || s.cover || null;

      const payload = {
        user_id: user.id,
        album: s.album || "",
        artist: s.artist || "",
        released: s.released || "",
        rankedby: s.rankedby || "",
        cover_url: coverUrl,
        avg_score: avg,
        tracks: s.tracks || [],
        notes: notes
      };

      const { error } = await supa.from("albums").insert(payload);
      if(error) throw error;
      alert("Saved to your library ✅");
      if($("#libModal").style.display === "flex") await loadLibrary(); // si está abierto, refrescar
    }catch(e){
      console.error(e);
      alert("Could not save. " + (e?.message || ""));
    }
  }

  function cardHTML(row){
    const img = row.cover_url || "";
    const title = row.album || "—";
    const artist = row.artist || "—";
    const avg = (row.avg_score==null) ? "—" : Number(row.avg_score).toFixed(1);
    return `
      <div class="libCard">
        <img src="${img}" alt="">
        <div>
          <div class="libTitle">${title}</div>
          <div class="libMeta">${artist}</div>
          <div class="libRow" style="margin-top:6px">
            <span class="libMeta">Avg: <strong>${avg}</strong></span>
          </div>
          <div class="libRow" style="margin-top:8px">
            <button class="libBtn libOpen" data-id="${row.id}">Open</button>
            <button class="libBtn libDelete" data-id="${row.id}">Delete</button>
          </div>
        </div>
      </div>
    `;
  }

  async function loadLibrary(){
    const { data: { user } } = await supa.auth.getUser();
    if(!user){ alert("Sign in to view your library."); return; }
    const sort = $("#libSort").value;

    let query = supa.from("albums").select("*").eq("user_id", user.id);
    if(sort === "top") query = query.order("avg_score", { ascending:false, nullsFirst:false });
    if(sort === "low") query = query.order("avg_score", { ascending:true, nullsFirst:true });
    if(sort === "new") query = query.order("created_at", { ascending:false });
    if(sort === "az")  query = query.order("album", { ascending:true });

    const { data, error } = await query;
    if(error){ console.error(error); alert("Could not load library."); return; }

    const grid = $("#libGrid");
    grid.innerHTML = (data||[]).map(cardHTML).join("") || `<div style="padding:14px">No albums yet.</div>`;

    // bind botones de cada card
    grid.querySelectorAll(".libOpen").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id = btn.getAttribute("data-id");
        const { data:rows } = await supa.from("albums").select("*").eq("id", id).limit(1);
        const row = rows?.[0];
        if(!row) return;
        // cargar en la UI actual
        window.AlbumApp.setState({
          lang: localStorage.getItem("albumrater_lang") || "en",
          album: row.album, artist: row.artist, released: row.released,
          rankedby: row.rankedby, cover: row.cover_url, tracks: row.tracks||[]
        });
        // restaurar notas en local para que aparezcan en Notes & Review
        try{
          const all = JSON.parse(localStorage.getItem(NOTES_KEY) || "{}");
          const key = `${safeName(row.album||"Album")}__${safeName(row.artist||"Artist")}`;
          all[key] = row.notes || { trackNotes:{}, final:"" };
          localStorage.setItem(NOTES_KEY, JSON.stringify(all));
          window.dispatchEvent(new Event("album-autofilled")); // reutiliza hooks para repintar notas
        }catch{}
        // cerrar modal
        $("#libModal").style.display = "none";
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    grid.querySelectorAll(".libDelete").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        if(!confirm("Delete this album from your library?")) return;
        const id = btn.getAttribute("data-id");
        const { error } = await supa.from("albums").delete().eq("id", id);
        if(error){ alert("Could not delete."); return; }
        await loadLibrary();
      });
    });
  }

  // UI bindings (auth + cloud actions)
  (function bindCloudUI(){
    $("#btnSignIn").addEventListener("click", async ()=>{
      try{
        await ensureSignedIn();
        await refreshAuthUI();
        alert("Signed in.");
      }catch(e){ console.warn(e.message||e); }
    });
    $("#btnSignOut").addEventListener("click", async ()=>{
      await supa.auth.signOut();
      await refreshAuthUI();
      alert("Signed out.");
    });
    $("#btnSaveCloud").addEventListener("click", saveToLibrary);
    $("#btnOpenLibrary").addEventListener("click", async ()=>{
      try{
        const user = await ensureSignedIn();
        if(user){
          $("#libModal").style.display = "flex";
          await loadLibrary();
        }
      }catch(e){ console.warn(e.message||e); }
    });
    $("#libClose").addEventListener("click", ()=> $("#libModal").style.display = "none");
    $("#libSort").addEventListener("change", loadLibrary);

    // auth listener
    supa.auth.onAuthStateChange((_event, _session)=> refreshAuthUI());
    // primera pintura
    refreshAuthUI();
  })();
</script>
</body>
</html>
