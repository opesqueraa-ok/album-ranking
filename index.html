<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Album Ranking</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    :root{--gap:10px;--bg:#0f1115;--panel:#161a22;--ink:#e9edf1;--muted:#aeb5c0;--line:#2a3140;--neutral:#2a3140;--accent:#7dd3fc}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif}
    header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#0f1115;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
    header .spacer{flex:1}
    button,label.btn{background:#1a1f2a;color:var(--ink);border:1px solid #283043;border-radius:10px;padding:8px 12px;cursor:pointer}
    button:hover,label.btn:hover{background:#202836}
    .badge{opacity:.8;border:1px solid var(--line);padding:4px 8px;border-radius:8px;font-size:12px}
    select,input{background:#0e1218;border:1px solid var(--line);color:var(--ink);padding:8px;border-radius:10px}

    /* ===== Editor ===== */
    .wrap{max-width:1100px;margin:18px auto;padding:0 16px 64px}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
    .pad{padding:14px}
    .pair{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin-bottom:8px}
    .label{font-size:13px;color:var(--muted)}
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
    .row{display:grid;grid-template-columns:60px 90px 1fr 160px 90px 36px;gap:8px;align-items:center;margin-bottom:6px}
    .pill{display:inline-flex;justify-content:center;align-items:center;padding:6px 10px;border-radius:8px;color:#fff;font-weight:800;min-width:52px;text-align:center;background:var(--neutral)}
    .cover{width:100%;aspect-ratio:1/1;object-fit:cover;border:1px solid var(--line);border-radius:10px;background:#0d1117}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;font-size:14px}
    th{color:var(--muted);font-weight:600}
    .final{font-size:52px;font-weight:800;text-align:center;margin-top:10px}
    canvas{width:100%;height:320px;border:1px solid var(--line);border-radius:12px;background:#0e1218}
    .footer{margin-top:10px;font-size:12px;color:#93a0b6}

    /* ===== Library (panel) ===== */
    #libPanel{max-width:1100px;margin:18px auto;padding:0 16px 32px;display:none}
    #libCard{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
    #tbl{width:100%;border-collapse:collapse}
    #tbl thead th{background:#151821;color:#cbd5e1}
    #tbl th,#tbl td{padding:10px 12px;border-bottom:1px solid #1b1e25}
    .col-cover{width:64px}
    .cover-sm{width:44px;height:44px;border-radius:6px;object-fit:cover;display:block;background:#0d1117;border:1px solid #1b1e25}
    .col-average,.col-tracks,.col-open{text-align:center;width:110px;white-space:nowrap}
  </style>
</head>
<body>
  <header>
    <strong>🎧 Album Ranking</strong><span class="badge">v7.1</span>
    <button id="btnLibrary" title="Abrir/cerrar mi librería">📚 Library</button>
    <button id="btnSaveToLibrary" title="Guardar el álbum actual en la nube">💾 Save to Library</button>

    <div class="spacer"></div>

    <!-- Herramientas de datos del EDITOR local -->
    <select id="lang">
      <option value="en">English</option>
      <option value="es" selected>Español</option>
    </select>
    <button id="exportJSON" title="Exportar datos locales (editor)">Export Data</button>
    <label class="btn" for="importJSON" title="Importar datos locales (editor)">Import Data</label>
    <input id="importJSON" type="file" accept="application/json" style="display:none" />
    <button id="clearAll">Clear All Data</button>

    <!-- Auth -->
    <span id="authStatus" style="margin-left:6px;display:none"></span>
    <button id="btnSignIn">Sign in with Google</button>
    <button id="btnSignOut" style="display:none">Sign out</button>
  </header>

  <!-- ======= Editor ======= -->
  <div id="app" class="wrap">
    <div class="grid">
      <div class="card pad">
        <div class="pair">
          <div class="label" data-i18n="album">Album</div>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="album" placeholder="Album name">
            <button id="btnBuscarAlbum" type="button">Buscar info</button>
          </div>
        </div>
        <div class="pair"><div class="label" data-i18n="artist">Artist</div><input id="artist" placeholder="Artist"></div>
        <div class="pair"><div class="label" data-i18n="released">Release Date</div><input id="released" placeholder="Aug 1, 2025"></div>
        <div class="pair"><div class="label" data-i18n="rankedby">Ranked by</div><input id="rankedby" placeholder="Your name or alias"></div>
        <div class="pair"><div class="label" data-i18n="cover">Cover</div><input id="cover" type="file" accept="image/*"></div>
        <div class="pair"><div class="label" data-i18n="trackcount">Tracks</div><input id="trackcount" type="number" min="1" value="7"></div>

        <div class="controls">
          <button id="applyCount">Apply Track Count</button>
          <button id="addRow">+ Add Row</button>
          <button id="delRow">– Remove Last</button>
          <button id="clearScores">Clear Score</button>
          <button id="sortTop10">Sort Top 10</button>
          <span class="label">Unscored = ‘-’</span>
        </div>

        <div class="row" style="font-size:12px;color:#aeb5c0">
          <div>#</div><div>Duration</div><div>Name</div><div>Score (int + decimal)</div><div>Color</div><div></div>
        </div>
        <div id="tracks"></div>
      </div>

      <div class="card pad">
        <div style="display:grid;grid-template-columns:1fr 360px;gap:16px">
          <div>
            <div id="info" style="display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:6px;align-items:center"></div>
            <table id="table"></table>
          </div>
          <div>
            <img id="coverOut" class="cover" alt="Cover">
            <div class="final" id="finalScore">—</div>
          </div>
        </div>

        <div style="margin-top:12px">
          <div style="font-size:12px;color:#aeb5c0;margin:6px 0">Enjoyment Timeline</div>
          <canvas id="chart" width="900" height="360"></canvas>
        </div>

        <div id="notesSection" class="card pad" style="margin-top:12px">
          <div style="font-size:12px;color:#aeb5c0;margin-bottom:6px">Notes & Review</div>
          <div id="notesOutput" style="white-space:pre-wrap;line-height:1.5;font-size:14px"></div>
          <div style="margin-top:10px">
            <div class="label">Final Album Thoughts</div>
            <textarea id="finalNotes" rows="4" placeholder="Write your closing thoughts..." style="width:100%;background:#0e1218;border:1px solid var(--line);color:var(--ink);padding:10px;border-radius:10px"></textarea>
          </div>
        </div>

        <div class="footer">Created by Ok Pretty Boy with help from ChatGPT</div>
      </div>
    </div>
  </div>

  <!-- ======= Library (plegable) ======= -->
  <section id="libPanel">
    <div id="libCard">
      <table id="tbl">
        <thead>
          <tr>
            <th class="col-cover">Cover</th>
            <th>Album</th>
            <th>Artist</th>
            <th>Released</th>
            <th class="col-average">Average</th>
            <th class="col-tracks">Tracks</th>
            <th class="col-open">Open</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" style="padding:14px;color:#aeb5c0">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Migración a 7.1: limpia SWs y cache -->
  <script>
    (async () => {
      if (!('serviceWorker' in navigator)) return;
      const cur = localStorage.getItem('app_ver');
      if (cur !== '7.1') {
        try {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            const url = String(reg.active?.scriptURL || reg.installing?.scriptURL || reg.waiting?.scriptURL || '');
            if (!url.includes('sw.v7.1.js')) await reg.unregister().catch(()=>{});
          }
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        } catch {}
        localStorage.setItem('app_ver','7.1');
        if (!location.search.includes('v=7.1')) location.replace(location.pathname + '?v=7.1');
      }
    })();
  </script>

  <!-- App scripts -->
  <script defer src="autofillAlbum.v7.1.js?v=7.1"></script>
  <script defer src="ui.v7.1.js?v=7.1"></script>
  <script defer src="auth.v7.1.js?v=7.1"></script>
  <script defer src="library.v7.1.js?v=7.1"></script>

  <!-- SW -->
  <script src="sw-register.v7.1.js"></script>
</body>
</html>
