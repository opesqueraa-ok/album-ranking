<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARA - Album Rater App | V11.0 Fix</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- ESTILOS GENERALES --- */
        :root { --bg-dark: #0b0f15; --bg-card: #161b26; --accent: #3b82f6; --text-main: #ffffff; --text-muted: #8a94a6; --border: rgba(255, 255, 255, 0.1); }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 1400px; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        h1 { font-family: 'Lora', serif; font-size: 24px; margin: 0; }
        .badge { font-family: 'Inter', sans-serif; font-size: 10px; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; vertical-align: middle; margin-left: 10px; color: var(--text-muted); }
        
        .main-grid { display: grid; grid-template-columns: 1fr 500px; gap: 40px; }
        @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr; } }

        .panel { background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); }
        .input-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
        input { background: #0b0f15; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 6px; outline: none; }
        
        #btnFetch { width: 100%; background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px dashed rgba(59, 130, 246, 0.3); padding: 12px; cursor: pointer; border-radius: 6px; font-weight: 600; margin-bottom: 20px; }

        /* PREVIEW CARD */
        .card-editorial { background: #050505; border-radius: 16px; padding: 35px; text-align: center; border: 1px solid #222; }
        .cover-container { width: 100%; aspect-ratio: 1/1; background: #1a1a1a; border-radius: 6px; overflow: hidden; margin-bottom: 25px; }
        .cover-img { width: 100%; height: 100%; object-fit: cover; }
        .big-score { font-weight: 800; font-size: 80px; margin: 10px 0; color: white; letter-spacing: -3px; }
        
        /* FIX: ELIMINADO UPPERCASE DE LOS TÍTULOS */
        .col-name { flex: 1; font-weight: 700; letter-spacing: 0.5px; text-align: left; }
        .preview-track-row { display: flex; align-items: center; margin-bottom: 12px; font-size: 13px; color: #eee; }
        .col-time, .col-num { width: 40px; color: #666; font-size: 11px; }
        .preview-badge { padding: 4px 8px; border-radius: 4px; font-weight: 800; min-width: 32px; display: inline-block; text-align: center; }

        /* MODAL */
        #searchModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:10000; justify-content:center; align-items:center; }
        .modal-content { background:#161b26; width:90%; max-width:500px; border-radius:12px; padding:20px; }
        .search-item { background:#0b0f15; padding:10px; margin-bottom:10px; border-radius:8px; cursor:pointer; display:flex; gap:15px; align-items:center; }

        .graph-container { width: 100%; height: 250px; margin-bottom: 20px; }
        .track-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>ARA <span class="badge">V11.0 LIVE SYNC</span></h1>
            <div class="header-actions">
                <button id="btnSaveLibrary" style="background:var(--accent); border:none; color:white; padding:10px 20px; border-radius:6px; cursor:pointer; font-weight:bold;">Guardar Imagen</button>
            </div>
        </header>

        <div class="main-grid">
            <div class="editor-col">
                <div class="panel">
                    <div class="input-row">
                        <div class="input-group"><label>Artista</label><input type="text" id="inArtist"></div>
                        <div class="input-group"><label>Álbum</label><input type="text" id="inAlbum"></div>
                    </div>
                    <button id="btnFetch">🔍 Buscar Álbum Real</button>
                    <div class="input-row">
                        <div class="input-group"><label>Año</label><input type="text" id="inYear"></div>
                        <div class="input-group"><label>Ranker</label><input type="text" id="inRanker"></div>
                    </div>
                </div>

                <div class="panel" style="margin-top:20px;">
                    <div id="trackEditor"></div>
                </div>
            </div>

            <div class="preview-col">
                <div class="panel" style="margin-bottom:20px;">
                    <div class="graph-container">
                        <canvas id="ratingChart"></canvas>
                    </div>
                </div>

                <div class="card-editorial" id="cardExport">
                    <div class="cover-container"><img id="prevCover" src="" class="cover-img"></div>
                    <div id="prevScore" class="big-score">0.0</div>
                    <div id="prevArtist" style="font-weight:bold;">Artista</div>
                    <div id="prevAlbum" style="font-family:'Lora'; font-style:italic; font-size:20px;">Álbum</div>
                    <div id="prevTracklistContainer" style="margin-top:20px;"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="searchModal"><div class="modal-content"><div id="searchResultsList"></div></div></div>

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-dragdata@2.2.3/dist/chartjs-plugin-dragdata.min.js"></script>

    <script>
        window.AlbumApp = (function() {
            let ratingChart = null;
            let state = { 
                artist: "", album: "", released: "", rankedby: "", cover: "", 
                tracks: [{ name: "Track 1", duration: "3:00", score: "8.0" }] 
            };

            const dom = {
                inArtist: document.getElementById("inArtist"),
                inAlbum: document.getElementById("inAlbum"),
                trackEditor: document.getElementById("trackEditor"),
                pScore: document.getElementById("prevScore"),
                pTracklist: document.getElementById("prevTracklistContainer")
            };

            // --- BUSCADOR MEJORADO ---
            async function searchAlbum() {
                const art = dom.inArtist.value;
                const alb = dom.inAlbum.value;
                if(!art) return alert("Pon al menos el artista");
                
                // Buscamos con un término más amplio para encontrar lanzamientos recientes
                const query = encodeURIComponent(`${art} ${alb}`);
                const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=album&limit=5`);
                const data = await res.json();
                
                const list = document.getElementById("searchResultsList");
                list.innerHTML = "<h3>Selecciona el correcto:</h3>";
                document.getElementById("searchModal").style.display = "flex";

                data.results.forEach(item => {
                    const div = document.createElement("div");
                    div.className = "search-item";
                    div.innerHTML = `<img src="${item.artworkUrl100}" width="50"> <div><b>${item.collectionName}</b><br>${item.artistName}</div>`;
                    div.onclick = () => loadTracks(item);
                    list.appendChild(div);
                });
            }

            async function loadTracks(album) {
                document.getElementById("searchModal").style.display = "none";
                const res = await fetch(`https://itunes.apple.com/lookup?id=${album.collectionId}&entity=song`);
                const data = await res.json();
                const tracks = data.results.filter(x => x.wrapperType === 'track').map(t => ({
                    name: t.trackName, 
                    duration: Math.floor(t.trackTimeMillis/60000) + ":" + String(Math.floor((t.trackTimeMillis%60000)/1000)).padStart(2,'0'),
                    score: "7.0"
                }));

                state.artist = album.artistName;
                state.album = album.collectionName;
                state.released = album.releaseDate.substring(0,4);
                state.cover = album.artworkUrl100.replace("100x100bb", "1000x1000bb");
                state.tracks = tracks;

                dom.inArtist.value = state.artist;
                dom.inAlbum.value = state.album;
                document.getElementById("inYear").value = state.released;
                
                renderEditor();
                renderPreview();
                updateChart();
            }

            // --- RENDER ---
            function getBadgeColor(v) {
                if (v >= 9) return "#3b82f6";
                if (v >= 7.5) return "#22c55e";
                if (v >= 6) return "#eab308";
                return "#ef4444";
            }

            function renderEditor() {
                dom.trackEditor.innerHTML = "";
                state.tracks.forEach((t, i) => {
                    const div = document.createElement("div");
                    div.className = "track-row";
                    div.innerHTML = `
                        <span style="width:20px">${i+1}</span>
                        <input type="text" value="${t.name}" style="flex:1" oninput="AlbumApp.updateTrackName(${i}, this.value)">
                        <input type="number" id="score-input-${i}" value="${t.score}" step="0.1" style="width:60px" oninput="AlbumApp.updateTrackScore(${i}, this.value)">
                    `;
                    dom.trackEditor.appendChild(div);
                });
            }

            function renderPreview() {
                document.getElementById("prevCover").src = state.cover;
                document.getElementById("prevArtist").textContent = state.artist;
                document.getElementById("prevAlbum").textContent = state.album;
                
                let total = 0;
                dom.pTracklist.innerHTML = "";
                state.tracks.forEach((t, i) => {
                    const s = parseFloat(t.score) || 0;
                    total += s;
                    dom.pTracklist.innerHTML += `
                        <div class="preview-track-row">
                            <span class="col-num">${i+1}</span>
                            <span class="col-name">${t.name}</span>
                            <span class="preview-badge" id="badge-${i}" style="background:${getBadgeColor(s)}">${s.toFixed(1)}</span>
                        </div>
                    `;
                });
                dom.pScore.textContent = (total / state.tracks.length).toFixed(1);
            }

            // --- CHART LOGIC ---
            function initChart() {
                const ctx = document.getElementById('ratingChart').getContext('2d');
                ratingChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: state.tracks.map((_, i) => i + 1),
                        datasets: [{
                            data: state.tracks.map(t => parseFloat(t.score)),
                            borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59,130,246,0.1)', pointRadius: 5
                        }]
                    },
                    options: {
                        scales: { y: { min: 0, max: 10 } },
                        plugins: {
                            dragData: {
                                round: 1,
                                onDrag: (e, datasetIndex, index, value) => {
                                    // SYNC EN TIEMPO REAL
                                    const val = Math.max(0, Math.min(10, value)).toFixed(1);
                                    state.tracks[index].score = val;
                                    
                                    // Actualizar input del editor
                                    const input = document.getElementById(`score-input-${index}`);
                                    if(input) input.value = val;
                                    
                                    // Actualizar badge del preview
                                    const badge = document.getElementById(`badge-${index}`);
                                    if(badge) {
                                        badge.textContent = val;
                                        badge.style.background = getBadgeColor(val);
                                    }
                                    
                                    // Actualizar promedio
                                    let total = 0;
                                    state.tracks.forEach(tr => total += parseFloat(tr.score));
                                    dom.pScore.textContent = (total / state.tracks.length).toFixed(1);
                                }
                            }
                        }
                    }
                });
            }

            function updateChart() {
                ratingChart.data.labels = state.tracks.map((_, i) => i + 1);
                ratingChart.data.datasets[0].data = state.tracks.map(t => parseFloat(t.score));
                ratingChart.update();
            }

            return {
                init: () => { renderEditor(); renderPreview(); initChart(); document.getElementById("btnFetch").onclick = searchAlbum; },
                updateTrackName: (i, v) => { state.tracks[i].name = v; renderPreview(); },
                updateTrackScore: (i, v) => { state.tracks[i].score = v; renderPreview(); updateChart(); }
            };
        })();

        AlbumApp.init();

        document.getElementById("btnSaveLibrary").onclick = () => {
            html2canvas(document.getElementById("cardExport"), { scale: 2, backgroundColor: "#050505" }).then(canvas => {
                const link = document.createElement("a");
                link.download = "ARA-Rating.png";
                link.href = canvas.toDataURL();
                link.click();
            });
        };
    </script>
</body>
</html>
