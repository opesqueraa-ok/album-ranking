<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Rater Editorial</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Lora:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f141e;
            --card: #1a2130;
            --text: #ffffff;
            --muted: #a0a0a0;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* --- Panel Izquierdo: Inputs --- */
        .editor-panel {
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input, select {
            width: 100%;
            background: #2a3140;
            border: 1px solid #3f4759;
            color: white;
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        /* --- Panel Derecho: Preview --- */
        .preview-panel {
            position: sticky;
            top: 20px;
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
            height: fit-content;
        }

        #prevCover {
            width: 280px;
            height: 280px;
            border-radius: 8px;
            object-fit: cover;
            background: #2a3140;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        #prevOverallScore {
            font-family: 'Lora', serif;
            font-size: 100px;
            font-weight: 700;
            margin: 0;
            line-height: 1;
            /* Eliminado el degradado por petición del usuario */
        }

        .prev-label { font-size: 12px; color: var(--muted); margin-top: 20px; text-transform: uppercase; }
        .prev-artist { font-size: 18px; font-weight: 600; margin-top: 5px; }
        .prev-album { font-size: 16px; opacity: 0.9; margin-top: 2px; }
        .prev-meta { font-size: 13px; color: var(--muted); margin-top: 10px; }
        .prev-ranker { font-size: 13px; color: var(--accent); margin-top: 15px; font-weight: 600; }

        /* Botones */
        .btn {
            cursor: pointer;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { opacity: 0.9; }

        /* Toast */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #23be32; color: white; padding: 10px 20px; border-radius: 50px;
            display: none; z-index: 1000;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; }
            .preview-panel { position: static; }
        }
    </style>
</head>
<body>

    <div id="toast"></div>

    <div class="app-container">
        <header>
            <div style="display:flex; align-items:center; gap:10px;">
                <h2 style="margin:0; font-family:'Lora', serif;">Album Rater</h2>
                <span style="font-size:10px; opacity:0.5; border:1px solid; padding:2px 4px; border-radius:4px;">EDITORIAL V7.2</span>
            </div>
            <div style="display:flex; gap:10px;">
                <select id="langSwitch" style="width: auto; padding: 5px;">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                </select>
                <button id="btnLibrary" class="btn" style="background:rgba(255,255,255,0.1); color:white;">Library</button>
                <button id="btnSaveLibrary" class="btn btn-primary">Save Album</button>
            </div>
        </header>

        <main class="editor-panel">
            <div class="input-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label id="lblArtist">Artist</label>
                    <input type="text" id="inArtist" placeholder="e.g. Ichiko Aoba">
                </div>
                <div>
                    <label id="lblAlbum">Album</label>
                    <input type="text" id="inAlbum" placeholder="e.g. Luminescent Creatures">
                </div>
            </div>
            
            <button id="btnFetch" class="btn" style="width:100%; background:#3f4759; color:white; margin-bottom:20px;">Fetch Info (MusicBrainz/iTunes)</button>

            <div class="input-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label id="lblYear">Release Year</label>
                    <input type="text" id="inYear" placeholder="2025">
                </div>
                <div>
                    <label id="lblRanker">Ranked By</label>
                    <input type="text" id="inRanker" placeholder="Your Name">
                </div>
            </div>

            <div id="tracksContainer">
                </div>
        </main>

        <aside class="preview-panel">
            <img id="prevCover" src="" alt="Album Cover">
            
            <div class="prev-label" id="lblOverall">Overall Score</div>
            <div id="prevOverallScore">0.0</div>
            
            <div class="prev-artist" id="resArtist">—</div>
            <div class="prev-album" id="resAlbum">—</div>
            <div class="prev-meta">
                <span id="resYear"></span> • <span id="resLength">0 min</span>
            </div>
            <div class="prev-ranker" id="resRanker"></div>
        </aside>
    </div>

    <script src="autofill.v7.2.js"></script>
    <script src="library.v7.2.js"></script>
    <script>
        /* --- Lógica Core de la App --- */
        window.AlbumApp = {
            state: {
                lang: 'en',
                artist: '', album: '', released: '', rankedby: '', cover: '',
                tracks: []
            },

            translations: {
                en: { lblArtist: "Artist", lblAlbum: "Album", lblYear: "Release Year", lblRanker: "Ranked By", lblOverall: "Overall Score", toastSave: "Saved to Library ✅" },
                es: { lblArtist: "Artista", lblAlbum: "Álbum", lblYear: "Año de Lanzamiento", lblRanker: "Rankeado por", lblOverall: "Puntaje General", toastSave: "Guardado en la Librería ✅" }
            },

            init() {
                // Binding de inputs
                document.querySelectorAll('input').forEach(el => {
                    el.addEventListener('input', () => this.syncState());
                });

                document.getElementById('langSwitch').addEventListener('change', (e) => {
                    this.state.lang = e.target.value;
                    this.updateUI();
                });

                this.updateUI();
            },

            syncState() {
                this.state.artist = document.getElementById('inArtist').value;
                this.state.album = document.getElementById('inAlbum').value;
                this.state.released = document.getElementById('inYear').value;
                this.state.rankedby = document.getElementById('inRanker').value;
                this.renderPreview();
            },

            setState(newState) {
                this.state = { ...this.state, ...newState };
                document.getElementById('inArtist').value = this.state.artist || '';
                document.getElementById('inAlbum').value = this.state.album || '';
                document.getElementById('inYear').value = this.state.released || '';
                document.getElementById('inRanker').value = this.state.rankedby || '';
                this.renderPreview();
            },

            getState() { return this.state; },

            updateUI() {
                const t = this.translations[this.state.lang];
                for (let key in t) {
                    const el = document.getElementById(key);
                    if (el) el.textContent = t[key];
                }
            },

            renderPreview() {
                document.getElementById('resArtist').textContent = this.state.artist || '—';
                document.getElementById('resAlbum').textContent = this.state.album || '—';
                document.getElementById('resYear').textContent = this.state.released || '';
                document.getElementById('resRanker').textContent = this.state.rankedby ? `Review by ${this.state.rankedby}` : '';
                
                const img = document.getElementById('prevCover');
                if (this.state.cover) {
                    img.src = this.state.cover;
                    img.style.display = 'block';
                }

                // Lógica de color del score
                const scoreEl = document.getElementById('prevOverallScore');
                const avg = this.computeAvg();
                scoreEl.textContent = avg;
                scoreEl.style.color = this.getColor(parseFloat(avg));
            },

            computeAvg() {
                if (this.state.tracks.length === 0) return "0.0";
                const scores = this.state.tracks.map(t => parseFloat(t.score)).filter(s => !isNaN(s));
                if (scores.length === 0) return "0.0";
                return (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
            },

            getColor(score) {
                if (score >= 9) return "#2e47ee";
                if (score >= 8) return "#0285c6";
                if (score >= 7) return "#23be32";
                if (score >= 6) return "#f0ca15";
                return "#e12928";
            }
        };

        window.AlbumApp.init();
    </script>
</body>
</html>
