<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Album Rater | Editorial Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Lora:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.webmanifest?v=7.2">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=7.2">
  <link rel="icon" href="favicon.png?v=7.2">
  <meta name="theme-color" content="#0a0c10">

  <style>
    :root {
      --c10: #2e47ee;
      --c9: #0285c6;
      --c8: #02aec6;
      --c7: #23be32;
      --c6: #f0ca15;
      --c5: #e12928;
      --bg: #0a0c10;
      --panel: #11141b;
      --ink: #f0f2f5;
      --muted: #8a94a3;
      --line: rgba(255, 255, 255, 0.08);
      --neutral: #2a3140;
      --accent: #7a9aff;
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      margin: 0;
      line-height: 1.6;
    }

    /* Títulos estilo Pitchfork */
    h1, h2, .final-score-title {
      font-family: 'Lora', serif;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px 100px;
    }

    /* Toolbar refinada */
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    .toolbar h1 { font-size: 28px; margin: 0; color: var(--ink); }

    /* Inputs y Botones minimalistas */
    input, select, button, textarea {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 12px 16px;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.06);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 12px 20px;
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }

    button#clearAll, button#delRow { background: transparent; border: 1px solid var(--line); color: var(--muted); }

    /* Tarjetas con profundidad */
    .card {
      background: var(--panel);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .pad { padding: 30px; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }

    .pair {
      margin-bottom: 18px;
    }

    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    /* Tabla Estilo Lista de Revista */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 5px;
      border-bottom: 1px solid var(--line);
      letter-spacing: 1px;
    }

    td {
      padding: 14px 5px;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }

    /* La Nota Final Impactante */
    .final {
      font-family: 'Lora', serif;
      font-size: 100px;
      font-weight: 900;
      text-align: center;
      line-height: 1;
      margin: 10px 0;
      background: linear-gradient(180deg, #fff 0%, var(--muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transition: transform 0.3s ease;
    }

    .cover:hover { transform: scale(1.02); }

    canvas {
      width: 100%;
      height: 300px;
      border-radius: 16px;
      background: rgba(0,0,0,0.2);
      margin-top: 15px;
    }

    /* El selector de tracks (UI interna) */
    .row {
      display: grid;
      grid-template-columns: 40px 80px 1fr 140px 60px 36px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255,255,255,0.02);
    }

    .pill {
      font-family: 'Lora', serif;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 16px;
      min-width: 45px;
    }

    /* Review & Notes Area */
    #notesSection {
      margin-top: 30px;
      border-top: 1px solid var(--line);
      padding-top: 20px;
    }

    #finalNotes {
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--line);
      font-family: 'Lora', serif;
      font-size: 17px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div class="wrap">
  <div class="toolbar">
    <h1>Album Rater</h1>
    <span id="verBadge" style="font-size:10px; color:var(--muted); border:1px solid var(--line); padding:2px 8px; border-radius:4px">EDITORIAL V7.2</span>
    
    <div style="flex:1"></div>

    <select id="lang">
      <option value="en">EN</option>
      <option value="es">ES</option>
    </select>
    <button id="btnMyLibrary" style="background:transparent; color:var(--ink); border:1px solid var(--line)">Library</button>
    <button id="btnSaveToLibrary">Save Album</button>
  </div>

  <div class="grid">
    <div>
      <div class="card pad">
        <h2 style="margin-top:0; font-size:20px; margin-bottom:25px">Album Metadata</h2>
        
        <div class="pair">
          <div class="label">Artist & Album</div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <input id="artist" placeholder="Artist Name">
            <input id="album" placeholder="Album Title">
          </div>
          <button id="btnBuscarAlbum" style="width:100%; margin-top:10px; background:#fff; color:#000">Fetch Info (MusicBrainz/iTunes)</button>
        </div>

        <div class="pair">
          <div class="label">Release & Ranker</div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
            <input id="released" placeholder="Year">
            <input id="rankedby" placeholder="Reviewer">
          </div>
        </div>

        <div class="pair">
          <div class="label">Tracklist Management</div>
          <div style="display:flex; gap:8px">
            <input id="trackcount" type="number" style="width:70px" value="7">
            <button id="applyCount" style="background:var(--line); color:var(--ink)">Set</button>
            <button id="addRow" style="background:var(--line); color:var(--ink)">+ Add</button>
          </div>
        </div>

        <div id="tracks" style="margin-top:30px">
          </div>

        <div style="margin-top:20px; display:flex; gap:10px">
          <button id="clearScores" style="flex:1; background:transparent; border:1px solid var(--line); color:var(--muted)">Reset Scores</button>
          <button id="clearAll" style="flex:1">Clear All</button>
        </div>
      </div>
    </div>

    <div>
      <div class="card pad" style="position: sticky; top: 20px;">
        <div style="text-align:center">
          <img id="coverOut" class="cover" alt="Album Cover">
          <div class="label" style="margin-top:20px">Overall Score</div>
          <div class="final" id="finalScore">—</div>
        </div>

        <div id="info" style="margin-bottom:20px; text-align:center">
          </div>

        <table id="table">
          </table>

        <div style="margin-top:40px">
          <div class="label">Enjoyment Timeline</div>
          <canvas id="chart"></canvas>
        </div>

        <div id="notesSection">
          <div class="label">Review / Thoughts</div>
          <textarea id="finalNotes" rows="5" placeholder="Write your editorial review here..." style="width:100%"></textarea>
        </div>

        <div class="toolbar" style="border:none; margin-top:20px; justify-content: center; opacity:0.5">
          <button id="exportJSON" style="font-size:11px; padding:5px 10px">Export</button>
          <label style="cursor:pointer; font-size:11px; border:1px solid var(--line); padding:5px 10px; border-radius:8px">
            Import <input id="importJSON" type="file" style="display:none">
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    &copy; 2026 ALBUM RATER | DESIGNED FOR CURATORS
  </div>
</div>

<div id="libraryBackdrop" class="modal-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(10px)">
  <div class="modal card pad" style="width:min(900px, 95vw); max-height:90vh; overflow:auto">
    <h2 class="final-score-title">Collection</h2>
    <div id="libraryList"></div>
    <button id="libraryClose" style="margin-top:20px">Close</button>
  </div>
</div>

<div id="toast" style="display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:#000; padding:12px 24px; border-radius:50px; font-weight:700; z-index:10000"></div>

<script defer src="autofillAlbum.v7.2.js?v=7.2"></script>
<script defer src="library.v7.2.js?v=7.2"></script>

</body>
</html>
